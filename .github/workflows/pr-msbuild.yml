name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-msbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x64 ${{ matrix.configuration }} (fail on warnings)
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        configuration: ["Debug", "Release"]

    defaults:
      run:
        shell: pwsh
        working-directory: s

    env:
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
      SOLUTION_PATH: '.\src\vcxproj\salamand.sln'
      LOG_DIRECTORY: build_logs
      # common output root of all projects (must end with a backslash)
      OPENSAL_BUILD_DIR: ${{ github.workspace }}\build\

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: s

      - name: Setup MSBuild in PATH (VS2026)
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC Developer Command Prompt (x64 toolchain)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Register MSVC problem matcher
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build via MSBuild (${{ matrix.configuration }} | x64)
        run: |
          $logDir = Join-Path (Get-Location) $env:LOG_DIRECTORY
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          New-Item -ItemType Directory -Force -Path $env:OPENSAL_BUILD_DIR | Out-Null

          $txtLog = Join-Path $logDir "msbuild-$($env:BUILD_CONFIGURATION)-x64-run$($env:GITHUB_RUN_NUMBER).log"
          Add-Content -Path $env:GITHUB_ENV -Value "LOG_PATH=$txtLog"

          $arguments = @(
            $env:SOLUTION_PATH
            '/m'
            '/t:Rebuild'
            "/p:Configuration=$($env:BUILD_CONFIGURATION)"
            '/p:Platform=x64'
            '/p:PreferredToolArchitecture=x64'
            '/warnaserror'
            '/nr:false'
            '/v:m'
          )

          msbuild @arguments 2>&1 | Tee-Object -FilePath $txtLog -Encoding UTF8

          if ($LASTEXITCODE -ne 0) {
            Write-Host "MSBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Build helpers via MSBuild (Utils (Release) | x64)
        # salopen, salspawn and the shell extension are only built in this solution
        # configuration; their post-build step copies them to Release_x64\utils.
        # The other Utils projects (tserver, translator, sfx7zip, zip2sfx) are not needed
        # by the program and still have 64-bit conversion warnings, so they are skipped.
        if: matrix.configuration == 'Release'
        run: |
          $txtLog = Join-Path (Join-Path (Get-Location) $env:LOG_DIRECTORY) "msbuild-Utils-x64-run$($env:GITHUB_RUN_NUMBER).log"
          $arguments = @(
            $env:SOLUTION_PATH
            '/m'
            '/t:salopen;salspawn;salextx64'
            '/p:Configuration=Utils (Release)'
            '/p:Platform=x64'
            '/p:PreferredToolArchitecture=x64'
            '/warnaserror'
            '/nr:false'
            '/v:m'
          )
          msbuild @arguments 2>&1 | Tee-Object -FilePath $txtLog -Encoding UTF8
          if ($LASTEXITCODE -ne 0) {
            Write-Host "MSBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Package portable ZIP
        id: package
        if: matrix.configuration == 'Release'
        run: ./tools/make_portable.ps1

      - name: Upload portable ZIP
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Upload debug symbols
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-symbols
          path: ${{ steps.package.outputs.symbols }}
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-x64-${{ matrix.configuration }}-logs
          path: s/build_logs/
          if-no-files-found: warn
